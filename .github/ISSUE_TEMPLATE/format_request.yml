name: Format request
description: A file type Filee can't open yet
title: "[Format]: "
labels: ["formats"]
body:
  - type: markdown
    attributes:
      value: |
        > [!IMPORTANT]
        > **Filee can't convert files that are encrypted or copy-protected (DRM), whatever their format.** Converting them means breaking that protection, so these requests are closed.
        >
        > Some examples, not a complete list:
        > - music downloaded in a streaming app (NetEase Cloud Music `.ncm`, QQ Music `.qmc` / `.mflac` / `.mgg`, Kugou `.kgm`, Apple Music, Spotify)
        > - e-books bought with DRM (Kindle `.azw` / `.kfx`, Adobe DRM EPUB or PDF)
        > - videos saved by streaming apps or sites that don't allow downloading
        > - files locked with a password you don't have
        >
        > If the app that made the file can export or save it in a common format, that is the way to go.
  - type: input
    id: extension
    attributes:
      label: File extension
      placeholder: ".xyz"
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: What makes these files?
      description: The program, device or website.
    validations:
      required: true
  - type: input
    id: target
    attributes:
      label: What should Filee convert them to?
      placeholder: "PDF, MP3, PNG…"
  - type: textarea
    id: details
    attributes:
      label: Anything else?
      description: A sample file if you can share one, a link to the format's documentation, or an open-source tool that reads it.
  - type: checkboxes
    id: not-protected
    attributes:
      label: Protection
      options:
        - label: These files aren't encrypted or copy-protected (DRM), and I can open them without a password.
          required: true
